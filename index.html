<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="py-5">
    <main class="container" style="max-width: 680px;">
      <h1 class="h2 fw-bold mb-4">Pindrop: Fixe e conclua</h1>

      <form id="form" onsubmit="return false" class="card border-0 shadow-sm rounded-4 p-3 p-md-4 mb-4">
        <div class="row g-2">
          <div class="col-12">
            <label for="nomeTarefa" class="form-label small text-secondary">Nome da tarefa</label>
            <input type="text" id="nomeTarefa" class="form-control" placeholder="O que precisa ser feito?" />
          </div>
          <div class="col-sm-5">
            <label for="prioridade" class="form-label small text-secondary">Prioridade</label>
            <select id="prioridade" class="form-select">
              <option>Baixa</option>
              <option>Média</option>
              <option>Alta</option>
            </select>
          </div>
          <div class="col-sm-7 d-flex align-items-end">
            <button type="button" id="botaoSubmeter" class="btn btn-primary w-100">Criar nova tarefa</button>
          </div>
        </div>
      </form>

      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0 text-secondary">Suas tarefas</h2>
        <select id="busca" class="form-select form-select-sm w-auto" aria-label="Filtrar tarefas">
          <option>Todas</option>
          <option>Concluídas</option>
          <option>Em andamento</option>
        </select>
      </div>

      <article>
        <ul id="catalogoTarefas" class="list-group list-group-flush rounded-4 shadow-sm overflow-hidden"></ul>
      </article>

      <article id="exibeEstatisticas" class="row g-3 mt-3"></article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
