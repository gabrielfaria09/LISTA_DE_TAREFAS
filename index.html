<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Lista de tarefas</h1>

    <form id="form" onsubmit="return false">
        <label>Nome da tarefa:</label>
        <input type="search" id="nomeTarefa">
        <input type="search" id="buscatarefa" placeholder="Busque uma tarefa...">
        <label>Prioridade:</label>
        <select id="prioridade">
            <option>Baixa</option>
            <option>Média</option>
            <option>Alta</option>
        </select>
        <button type="button" id="botaoSubmeter">Criar nova tarefa</button>
    </form>
    <article>
        <ul id="catalogoTarefas">

        </ul>
    </article>

    <script src="script.js"></script>
</body>
</html>
